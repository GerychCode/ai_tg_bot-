version: '3.8'

services:
  bot:
    build: .
    container_name: syvolap_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # Бот чекатиме, поки БД не стане повністю "здоровою"
    command: ["python", "main.py"]

  db:
    image: postgres:15-alpine
    container_name: syvolap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bot_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-bot_password}
      POSTGRES_DB: ${DB_NAME:-bot_database}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Пінг бази даних: перевірка, чи вона готова приймати з'єднання
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bot_admin} -d ${DB_NAME:-bot_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: